<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0A0E17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CIDnow"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=0.6.0"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>CIDnow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: app a colonna singola (max 560px), barra superiore sticky, barra azioni fissa in basso. Blu = Veicolo A, Giallo = Veicolo B, come nel modulo cartaceo. */
:root{
  --bg:#0A0E17; --surface:#121826; --surface2:#1A2233; --line:#263044;
  --fg:#E8EDF6; --muted:#8C97AD; --a:#4C8DFF; --a-soft:rgba(76,141,255,.14);
  --b:#F2C230; --b-soft:rgba(242,194,48,.14); --ok:#3DDC97; --warn:#FF9F43; --danger:#FF5C6C;
  --on-a:#fff; --on-b:#1a1400; --grid:rgba(120,150,210,.06); --glow:0 0 0 1px rgba(76,141,255,.35),0 8px 30px rgba(76,141,255,.25);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E9EDF3; --line:#D3DAE5; --fg:#0E1422; --muted:#5A6477;
  --a:#1F5FD6; --a-soft:rgba(31,95,214,.10); --b:#A87C00; --b-soft:rgba(232,180,20,.18);
  --ok:#0F8A57; --warn:#B85F00; --danger:#CC2B3B; --on-a:#fff; --on-b:#1a1400; --grid:rgba(30,60,120,.05);
  --glow:0 0 0 1px rgba(31,95,214,.3),0 8px 24px rgba(31,95,214,.18); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface2:#E9EDF3; --line:#D3DAE5; --fg:#0E1422; --muted:#5A6477;
  --a:#1F5FD6; --a-soft:rgba(31,95,214,.10); --b:#A87C00; --b-soft:rgba(232,180,20,.18);
  --ok:#0F8A57; --warn:#B85F00; --danger:#CC2B3B; --on-a:#fff; --on-b:#1a1400; --grid:rgba(30,60,120,.05);
  --glow:0 0 0 1px rgba(31,95,214,.3),0 8px 24px rgba(31,95,214,.18); color-scheme:light}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
  display:flex;align-items:center;gap:12px;padding-block:12px;margin-inline:-4px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.brand img{width:34px;height:34px;border-radius:9px;display:block}
.brand small{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.12em;font-weight:500}
.topbar .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:40px;min-width:40px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-size:13px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:28px;line-height:1.1}
h2{font-size:20px}
h3{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.a{border-color:color-mix(in srgb,var(--a) 45%,var(--line))}
.card.b{border-color:color-mix(in srgb,var(--b) 50%,var(--line))}
.tag{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.08em;border-radius:6px;padding:2px 7px;display:inline-flex;align-items:center;gap:4px}
.tag.a{background:var(--a);color:var(--on-a)} .tag.b{background:var(--b);color:var(--on-b)}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.ghost{border:1px solid var(--line);color:var(--muted)}

.btn{border:0;border-radius:14px;min-height:48px;padding:0 18px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);border:1px solid var(--line)}
.btn.primary{background:var(--a);color:var(--on-a);border-color:transparent;box-shadow:var(--glow)}
.btn.yellow{background:var(--b);color:var(--on-b);border-color:transparent}
.btn.danger{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.small{min-height:38px;font-size:13px;padding:0 12px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--a);cursor:pointer;padding:4px 0;font-weight:600}

/* Hero CTA */
.sos{position:relative;border-radius:24px;padding:22px;background:
  radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--a) 35%,transparent),transparent 60%),
  radial-gradient(90% 80% at 0% 100%,color-mix(in srgb,var(--b) 22%,transparent),transparent 60%),var(--surface);
  border:1px solid var(--line);display:flex;flex-direction:column;gap:14px;overflow:hidden}
.sos .corner{position:absolute;width:18px;height:18px;border:2px solid var(--a)}
.sos .c1{top:10px;left:10px;border-right:0;border-bottom:0}.sos .c2{top:10px;right:10px;border-left:0;border-bottom:0}
.sos .c3{bottom:10px;left:10px;border-right:0;border-top:0}.sos .c4{bottom:10px;right:10px;border-left:0;border-top:0}
.bigcta{min-height:64px;font-size:18px;font-family:var(--f-display);letter-spacing:.04em}

.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.status div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.status b{font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--danger)}

.banner{border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.banner.ok{background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.banner.info{background:var(--a-soft);border:1px solid color-mix(in srgb,var(--a) 30%,transparent)}
.banner .ic{font-family:var(--f-mono);font-weight:700}

/* Steps */
.steps{display:flex;gap:4px;margin-block:4px 2px}
.steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
.steps span.on{background:var(--a)}.steps span.done{background:color-mix(in srgb,var(--a) 50%,var(--line))}
.stepname{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

/* Form */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.fld input,.fld select,.fld textarea{width:100%;min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--surface2);padding:10px 12px;font-size:15px}
.fld textarea{min-height:84px;resize:vertical}
.fld input.auto{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.fld input.plate{font-family:var(--f-mono);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--a)}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);min-width:70px}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 0 var(--line)}
details.sec{border:1px solid var(--line);border-radius:14px;background:var(--surface)}
details.sec summary{cursor:pointer;padding:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px;list-style:none}
details.sec summary::-webkit-details-marker{display:none}
details.sec .in{padding:0 14px 14px}

/* Autocompletamento */
.fld{position:relative}
.acl{position:absolute;left:0;right:0;top:100%;z-index:8;margin:4px 0 0;padding:4px;list-style:none;background:var(--surface);border:1px solid color-mix(in srgb,var(--a) 45%,var(--line));border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);max-height:260px;overflow:auto}
.acl li{padding:9px 10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.acl li:hover,.acl li.on{background:var(--a-soft)}
.acl li small{color:var(--muted);font-family:var(--f-mono);font-size:11px;white-space:nowrap}
.fhint{font-size:12px;min-height:0}.fhint.ok{color:var(--ok)}.fhint.bad{color:var(--warn)}
.fld input.flash{animation:flash 1s}
@keyframes flash{0%{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 55%,transparent)}100%{box-shadow:0 0 0 0 transparent}}
/* Scanner documenti */
#scanner{position:fixed;inset:0;z-index:40;background:#000;color:#fff;overflow:hidden}
#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#scanner .sc-mask{position:absolute;inset:0;background:rgba(0,0,0,.55)}
#scanner .sc-frame{position:absolute;border-radius:14px}
#scanner .sc-frame i{position:absolute;background:rgba(255,255,255,.85);border-radius:3px;transition:background .15s,box-shadow .15s}
#scanner .sc-frame .t{left:6%;right:6%;top:-3px;height:5px}#scanner .sc-frame .b{left:6%;right:6%;bottom:-3px;height:5px}
#scanner .sc-frame .l{top:8%;bottom:8%;left:-3px;width:5px}#scanner .sc-frame .r{top:8%;bottom:8%;right:-3px;width:5px}
#scanner .sc-frame i.on{background:#2EE87A;box-shadow:0 0 12px #2EE87A}
#scanner.ready .sc-frame{box-shadow:0 0 0 4px #2EE87A,0 0 30px rgba(46,232,122,.6)}
#scanner.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:scflash .45s ease-out forwards}
@keyframes scflash{from{opacity:.9}to{opacity:0}}
#scanner .sc-top{position:absolute;left:0;right:0;top:0;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;align-items:flex-start;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#scanner .sc-top b{font-family:var(--f-display);font-size:20px}#scanner .sc-sub{font-size:13px;opacity:.8}
#scanner .sc-msg{position:absolute;left:16px;right:16px;bottom:calc(120px + env(safe-area-inset-bottom,0px));text-align:center;font-weight:600;font-size:16px;text-shadow:0 1px 4px #000}
#scanner .sc-bar{position:absolute;left:0;right:0;bottom:0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
#scanner .sc-bar .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.25)}
#scanner .sc-bar .btn:last-child{justify-self:end}
#scanner .sc-shot{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);cursor:pointer}
/* Privacy */
.consent{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer}
.consent input{width:22px;height:22px;flex:none;accent-color:var(--a);margin-top:2px}
.consent b{display:block}.consent span{font-size:13px;color:var(--muted)}
.consent.req{border-color:color-mix(in srgb,var(--a) 40%,var(--line))}
.legal{font-size:13.5px;line-height:1.55;color:var(--fg)}.legal h4{margin:12px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}.legal p,.legal ul{margin:0 0 6px}.legal ul{padding-left:18px}
.hero-icon{width:92px;height:92px;border-radius:22px;box-shadow:var(--glow)}
/* Photos */
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.shot{position:relative;border:1.5px dashed var(--line);border-radius:16px;min-height:132px;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background:var(--surface);cursor:pointer;overflow:hidden}
.shot.has{border-style:solid;border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.shot.full{grid-column:1/-1}
.shot b{font-size:13px;position:relative;z-index:1}
.shot small{color:var(--muted);font-size:11px;position:relative;z-index:1}
.shot .cam{font-family:var(--f-mono);font-size:11px;color:var(--a);position:relative;z-index:1}
.shot .thumbs{display:flex;gap:6px;overflow-x:auto;position:relative;z-index:1}
.shot .thumbs img{width:56px;height:56px;object-fit:cover;border-radius:9px;flex:none}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer;z-index:2}
.shot.a b{color:var(--a)} .shot.b b{color:var(--b)}

/* Car zone picker */
.zones{display:flex;gap:14px;align-items:center}
.zones svg{width:96px;flex:none}
.zones svg .z{cursor:pointer;fill:transparent;stroke:var(--line);stroke-width:1}
.zones svg .z:hover{fill:var(--surface2)}
.zones svg .body{fill:var(--surface2);stroke:var(--muted);stroke-width:1.5}
.zones.a svg .z.on{fill:var(--a);fill-opacity:.75}.zones.b svg .z.on{fill:var(--b);fill-opacity:.8}
.zones .lbl{font-size:13px;min-width:0}

/* Circostanze */
.circ{width:100%;border-collapse:collapse;font-size:13.5px}
.circ td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:middle}
.circ td.n{font-family:var(--f-mono);color:var(--muted);width:26px;text-align:center}
.circ td.cb{width:44px;text-align:center}
.circ th{font-family:var(--f-mono);font-size:11px;padding:6px 4px}
.cbx{width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.cbx.a.on{background:var(--a);border-color:var(--a);color:var(--on-a)}.cbx.b.on{background:var(--b);border-color:var(--b);color:var(--on-b)}
.circ tr.sug td:not(.n):not(.cb){color:var(--fg);font-weight:600}

/* Canvas pads */
.pad{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
.pad canvas{display:block;width:100%;touch-action:none;cursor:crosshair}
.pad .hint{position:absolute;left:12px;bottom:10px;font-size:12px;color:#7a8192;pointer-events:none;font-family:var(--f-mono)}
.pad.sign canvas{height:170px}.pad.sketch canvas{height:260px}
.pad .line{position:absolute;left:16px;right:16px;bottom:34px;border-bottom:1px dashed #b9c0cc;pointer-events:none}

/* REC */
.rec{display:flex;align-items:center;gap:14px}
.recbtn{width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;background:var(--danger);color:#fff;font-family:var(--f-display);font-weight:700;letter-spacing:.06em;flex:none;position:relative}
.recbtn.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--danger) 60%,transparent)}100%{box-shadow:0 0 0 18px transparent}}
.timer{font-family:var(--f-mono);font-size:22px;font-weight:700}

/* Bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bottombar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
.bottombar .btn{flex:1}
.bottombar .btn.back{flex:0 0 auto}

/* Archive */
.rep{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.rep .mono{font-family:var(--f-mono);font-size:12px}
.plate{font-family:var(--f-mono);font-weight:700;letter-spacing:.1em;border:1.5px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface2)}

/* GPS radar */
.radar{display:flex;gap:14px;align-items:center}
.radar .scope{width:64px;height:64px;border-radius:50%;flex:none;position:relative;border:1px solid color-mix(in srgb,var(--a) 50%,transparent);
  background:repeating-radial-gradient(circle,transparent 0 10px,color-mix(in srgb,var(--a) 22%,transparent) 10px 11px)}
.radar .scope::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:var(--a);box-shadow:0 0 12px var(--a)}
.radar.scan .scope{animation:spin 2s linear infinite;background:conic-gradient(from 0deg,color-mix(in srgb,var(--a) 45%,transparent),transparent 30%),repeating-radial-gradient(circle,transparent 0 10px,color-mix(in srgb,var(--a) 22%,transparent) 10px 11px)}
@keyframes spin{to{transform:rotate(360deg)}}
.coords{font-family:var(--f-mono);font-size:12px;color:var(--muted)}

/* AI result */
.ai{border-radius:16px;padding:14px;border:1px solid color-mix(in srgb,var(--a) 40%,var(--line));background:linear-gradient(135deg,var(--a-soft),transparent 70%);display:flex;flex-direction:column;gap:8px}
.ai .kind{font-family:var(--f-display);font-size:20px;font-weight:700}

/* Modal + toast */
.modal{position:fixed;inset:0;z-index:20;background:rgba(5,8,14,.66);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.modal .sheet{background:var(--surface);border:1px solid var(--line);border-radius:22px;max-width:520px;width:100%;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
.qrbox{background:#fff;border-radius:16px;padding:14px;display:flex;justify-content:center}
.qrbox svg{width:min(78vw,300px);height:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;display:inline-block}

/* CID preview */

      ${g.geo === "fail" ? `<div class="muted" style="font-size:12px;margin-top:4px">Indirizzo non risolto senza rete: completa via e comune.</div>` : ""}
      <a href="https://www.openstreetmap.org/?mlat=${g.lat}&mlon=${g.lon}#map=18/${g.lat}/${g.lon}" target="_blank" rel="noopener" class="link" style="display:inline-block;margin-top:4px">Apri sulla mappa</a></div></div></div>`;
  else gpsCard = g.state === "idle" && consentOn("gps") ? `<div class="banner info"><span class="ic">◎</span><div>Attiva il GPS per inserire in automatico via, comune, provincia e tipo di luogo.<div class="row" style="margin-top:8px"><button class="btn small primary" data-act="gps">Usa la mia posizione</button></div></div></div>` : gpsWarning();
  return `<div><h1>Dove e quando</h1><p class="muted" style="margin:6px 0 0">Caselle 1–5 del modulo. Data e ora sono già inserite.</p></div>
  ${gpsCard}
  <section class="card"><h3>1 · Data e ora</h3><div class="grid2">
    <label class="fld" for="R-data"><span>Data</span><input id="R-data" type="date" data-bind="R.data" value="${esc(r.data)}"></label>
    <label class="fld" for="R-ora"><span>Ora</span><input id="R-ora" type="time" data-bind="R.ora" value="${esc(r.ora)}"></label></div></section>
  <section class="card"><div class="row" style="justify-content:space-between"><h3>2 · Località</h3>${L.fonte === "gps" ? `<span class="tag ok">DA GPS</span>` : `<span class="tag ghost">MANUALE</span>`}</div>
    <div class="grid2">
      ${[["comune", "Comune"], ["prov", "Provincia (sigla)"], ["via", "Via / piazza", 1], ["civico", "Civico / km"], ["cap", "CAP"], ["paese", "Stato"]].map(([k, l, full]) =>
        `<label class="fld ${full ? "full" : ""}" for="L-${k}"><span>${l}</span><input id="L-${k}" data-bind="L.${k}" value="${esc(L[k])}" class="${L.fonte === "gps" && L[k] ? "auto" : ""}" autocomplete="off" ${k === "prov" ? 'data-upper="1" maxlength="2"' : ""} ${k === "comune" ? 'data-ac="comune" data-tc="1"' : ""} ${k === "cap" ? 'data-ac="cap" inputmode="numeric" maxlength="5"' : ""} ${k === "via" ? 'data-tc="1" data-ac="via"' : ""}></label>`).join("")}
    </div>
    <div><span class="eyebrow">Tipo di luogo</span><div class="seg" style="margin-top:6px">${Object.entries(PLACES).map(([k, l]) => `<button data-act="place" data-v="${k}" class="${r.place === k ? "on" : ""}">${l}</button>`).join("")}</div></div>
  </section>
  <section class="card"><h3>3–5 · Feriti, danni, testimoni</h3>
    ${checkHTML("R", "feriti", "Ci sono feriti, anche lievi", r)}
    ${checkHTML("R", "danniVeicoli", "Danni materiali a veicoli diversi da A e B", r)}
    ${checkHTML("R", "danniOggetti", "Danni a oggetti diversi dai veicoli", r)}
    ${r.feriti ? `<div class="banner warn"><span class="ic">!</span><div>Con feriti chiama il <b>112</b>. Il CID resta utile, ma intervengono le autorità.</div></div>` : ""}
    <label class="fld" for="R-testimoni"><span>Testimoni: nome, indirizzo, telefono</span><textarea id="R-testimoni" data-bind="R.testimoni">${esc(r.testimoni)}</textarea></label>
  </section>`;
}

function zonePicker(who, sel) {
  const z = (k, x, y, w, h) => `<rect class="z ${sel.includes(k) ? "on" : ""}" data-act="zone" data-who="${who}" data-z="${k}" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"><title>${ZONES[k]}</title></rect>`;
  return `<div class="zones ${who.toLowerCase()}"><svg viewBox="0 0 100 170" role="group" aria-label="Punto d'urto veicolo ${who}">
    <rect class="body" x="24" y="14" width="52" height="142" rx="18"/><rect x="31" y="44" width="38" height="22" rx="5" fill="none" stroke="currentColor" opacity=".35"/><rect x="31" y="108" width="38" height="18" rx="5" fill="none" stroke="currentColor" opacity=".35"/>
    <text x="50" y="10" text-anchor="middle" font-size="8" fill="currentColor" opacity=".6">FRONTE</text>
    ${z("AS", 6, 14, 30, 34)}${z("A", 36, 4, 28, 30)}${z("AD", 64, 14, 30, 34)}${z("S", 6, 52, 22, 66)}${z("D", 72, 52, 22, 66)}${z("PS", 6, 122, 30, 34)}${z("P", 36, 136, 28, 30)}${z("PD", 64, 122, 30, 34)}
  </svg><div class="lbl"><b>Dove ha colpito? <span class="tag ${who.toLowerCase()}">${who}</span></b><div class="muted">${sel.length ? sel.map(k => ZONES[k]).join(", ") : "Tocca le zone danneggiate sul disegno"}</div></div></div>`;
}

function stepFoto(r) {
  if (!consentOn("camera")) return `<div><h1>Fotografa l'accaduto</h1></div><div class="banner warn"><span class="ic">!</span><div><b>Consenso a fotocamera e foto non dato.</b> Il riconoscimento automatico di targa, documenti e tipo di incidente non è disponibile: segna le zone d'urto qui sotto e compila a mano.<div class="row" style="margin-top:8px"><button class="btn small" data-act="privacy">Privacy e consensi</button></div></div></div>
  <section class="card a">${zonePicker("A", r.A.urto)}</section><section class="card b">${zonePicker("B", r.B.urto)}</section>
  <section class="card"><span class="eyebrow">Uno dei veicoli era fermo?</span><div class="seg">${[["nessuno", "No, entrambi in marcia"], ["A", "A era fermo"], ["B", "B era fermo"]].map(([k, l]) => `<button data-act="fermo" data-v="${k}" class="${r.fermo === k ? "on" : ""}">${l}</button>`).join("")}</div></section>${aiCard(r)}`;
  const shots = SLOTS.map(s => {
    const ph = r.photos.filter(p => p.slot === s.k);
    return `<div class="shot ${s.cls || ""} ${ph.length ? "has" : ""}"><input type="file" accept="image/*" capture="environment" ${s.multi ? "multiple" : ""} data-act-file="photo" data-slot="${s.k}" aria-label="${esc(s.l)}">
      <div><b>${esc(s.l)}</b><br><small>${esc(s.d)}</small></div>
      ${ph.length ? `<div class="thumbs">${ph.map(p => `<img src="${p.src}" alt="">`).join("")}</div>` : `<span class="cam">◉ SCATTA</span>`}</div>`;
  }).join("");
  return `<div><h1>Fotografa l'accaduto</h1><p class="muted" style="margin:6px 0 0">Ogni foto ha un compito: dal tipo di scatto e dalle zone d'urto l'app capisce la dinamica e pre-compila il modulo.</p></div>
  <div class="shots">${shots}</div>
  ${r.photos.length ? `<button class="link" data-act="clearPhotos" style="align-self:flex-start">Rimuovi tutte le foto</button>` : ""}
  <section class="card a">${zonePicker("A", r.A.urto)}</section>
  <section class="card b">${zonePicker("B", r.B.urto)}</section>
  <section class="card"><span class="eyebrow">Uno dei veicoli era fermo?</span><div class="seg">${[["nessuno", "No, entrambi in marcia"], ["A", "A era fermo"], ["B", "B era fermo"]].map(([k, l]) => `<button data-act="fermo" data-v="${k}" class="${r.fermo === k ? "on" : ""}">${l}</button>`).join("")}</div></section>
  ${aiCard(r)}`;
}

function aiCard(r) {
  const can = aiReady() && r.photos.length;
  const res = r.tipo ? `<div class="ai"><div class="row" style="justify-content:space-between"><span class="eyebrow">Incidente rilevato</span><span class="tag ${r.conf === "alta" ? "ok" : "warn"}">AFFIDABILITÀ ${esc((r.conf || "bassa").toUpperCase())}</span></div>
      <div class="kind">${esc(r.tipo)}</div><div>${esc(r.tipoDescr)}</div>
      <div class="muted" style="font-size:13px">Circostanze proposte · A: ${r.suggest.A.length ? r.suggest.A.join(", ") : "nessuna"} · B: ${r.suggest.B.length ? r.suggest.B.join(", ") : "nessuna"}. Le verifichi al passo Dinamica.</div>
      <div class="muted" style="font-size:12px">Metodo: ${esc(r.metodo)}</div></div>` : "";
  return `${res}<div class="stack" style="gap:8px">
    <button class="btn ${can ? "primary" : ""} block" data-act="analyze" ${S.ai.busy ? "disabled" : ""}>${S.ai.busy ? `<span class="spin"></span> ${esc(S.ai.msg || "Analisi delle foto in corso…")}` : can ? "Analizza le foto con AI" : "Calcola la dinamica e leggi targa e documenti"}</button>
    ${!aiReady() ? `<span class="muted" style="font-size:12px">Analisi AI delle immagini non attiva: la dinamica viene stimata dalle zone d'urto, dal tipo di luogo e dai veicoli fermi.</span>` : !r.photos.length ? `<span class="muted" style="font-size:12px">Scatta almeno una foto per l'analisi AI. Senza foto la dinamica viene stimata dalle zone d'urto.</span>` : ""}
  </div>`;
}

function stepB(r) {
  const B = r.B, A = r.A;
  return `<div><h1>L'altro conducente</h1><p class="muted" style="margin:6px 0 0">Veicolo B. Se ha ${APP.name}, basta inquadrare il suo QR e tutto si compila da solo.</p></div>
  <section class="card b"><div class="row" style="justify-content:space-between"><b>Anche B ha l'app?</b><span class="tag b">B</span></div>
    <div class="grid2"><label class="btn yellow" style="position:relative">Scansiona QR di B<input type="file" accept="image/*" capture="environment" data-act-file="scanQR" style="position:absolute;inset:0;opacity:0"></label>
    <button class="btn" data-act="myqr">Mostra il mio QR</button></div>
    <span class="muted" style="font-size:12px">Nell'app installata i telefoni si scambiano i dati anche avvicinandoli (Bluetooth / NFC). Il QR funziona sempre, anche tra iPhone e Android.</span></section>
  <section class="card">${checkHTML("B", "informato", "Ho informato il conducente B che i suoi dati servono solo a compilare questo CID (art. 14 GDPR)", B)}</section>
  <section class="card"><div class="row" style="justify-content:space-between"><b>B non ha l'app</b>${aiReady() ? `<span class="tag ok">AI</span>` : ""}</div>
    <button class="btn yellow" data-act="docPicker" data-t="B" ${S.ai.busy ? "disabled" : ""}>${S.ai.busy ? `<span class="spin"></span> ${esc(S.ai.msg || "Lettura documenti…")}` : "Scansiona patente, libretto e assicurazione di B"}</button>
    <span class="muted" style="font-size:12px">Oppure compila a mano: comune, via, CAP, provincia e codice fiscale si completano da soli.</span></section>
  <details class="sec" open><summary><span><span class="tag b">B</span> Conducente</span><span class="muted">${filled(B, F_DRIVER)}</span></summary><div class="in">${fieldsHTML("B", F_DRIVER, B, r.autoFields.B)}</div></details>
  <details class="sec" open><summary><span><span class="tag b">B</span> Veicolo</span><span class="muted">${filled(B, F_VEH)}</span></summary><div class="in">${fieldsHTML("B", F_VEH, B, r.autoFields.B)}</div></details>
  <details class="sec" open><summary><span><span class="tag b">B</span> Assicurazione</span><span class="muted">${filled(B, F_INS)}</span></summary><div class="in">${fieldsHTML("B", F_INS, B, r.autoFields.B)}${checkHTML("B", "kasko", "La polizza copre i danni propri", B)}</div></details>
  <details class="sec"><summary><span><span class="tag b">B</span> Contraente / assicurato</span><span class="muted">${B.contrSame ? "= conducente" : "diverso"}</span></summary><div class="in">${contrHTML("B", B)}</div></details>
  <details class="sec"><summary><span><span class="tag a">A</span> I tuoi dati (dal profilo)</span><span class="muted">${filled(A, ALL_FIELDS)}</span></summary><div class="in stack">${fieldsHTML("A", F_DRIVER, A)}${fieldsHTML("A", F_VEH, A)}${fieldsHTML("A", F_INS, A)}${contrHTML("A", A)}</div></details>
  <button class="link" data-act="fillExampleB" style="align-self:flex-start">Prova: riempi B con dati di esempio</button>`;
}
function contrHTML(p, o) {
  return `${checkHTML(p, "contrSame", "Il contraente della polizza è il conducente", o, true)}${o.contrSame ? "" : `<div class="grid2">
    <label class="fld full" for="${p}-contrNome"><span>Cognome e nome / ragione sociale</span><input id="${p}-contrNome" data-bind="${p}.contrNome" value="${esc(o.contrNome)}"></label>
    <label class="fld full" for="${p}-contrIndirizzo"><span>Indirizzo</span><input id="${p}-contrIndirizzo" data-bind="${p}.contrIndirizzo" value="${esc(o.contrIndirizzo)}"></label></div>`}`;
}

function stepDinamica(r) {
  const rows = CIRC.map((c, i) => { const n = i + 1, sug = r.suggest.A.includes(n) || r.suggest.B.includes(n);
    return `<tr class="${sug ? "sug" : ""}"><td class="cb"><button class="cbx a ${r.A.circ.includes(n) ? "on" : ""}" data-act="circ" data-who="A" data-n="${n}" aria-label="A ${n}">${r.A.circ.includes(n) ? "✓" : ""}</button></td>
      <td class="n">${n}</td><td>${esc(c)}</td>
      <td class="cb"><button class="cbx b ${r.B.circ.includes(n) ? "on" : ""}" data-act="circ" data-who="B" data-n="${n}" aria-label="B ${n}">${r.B.circ.includes(n) ? "✓" : ""}</button></td></tr>`; }).join("");
  return `<div><h1>Com'è andata</h1><p class="muted" style="margin:6px 0 0">Caselle 10–14. ${r.tipo ? `Pre-compilato per <b>${esc(r.tipo)}</b>: controlla e correggi.` : "Segna le circostanze per ciascun veicolo."}</p></div>
  <section class="card"><h3>12 · Circostanze</h3><div style="overflow-x:auto"><table class="circ"><thead><tr><th><span class="tag a">A</span></th><th></th><th style="text-align:left" class="muted">Mettere una croce in ciascuna casella utile</th><th><span class="tag b">B</span></th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td class="cb"><b>${r.A.circ.length}</b></td><td></td><td class="muted">Numero di caselle segnate</td><td class="cb"><b>${r.B.circ.length}</b></td></tr></tfoot></table></div></section>
  <section class="card a">${zonePicker("A", r.A.urto)}<label class="fld" for="A-danni"><span>11 · Danni visibili al veicolo A</span><textarea id="A-danni" data-bind="A.danni">${esc(r.A.danni)}</textarea></label></section>
  <section class="card b">${zonePicker("B", r.B.urto)}<label class="fld" for="B-danni"><span>11 · Danni visibili al veicolo B</span><textarea id="B-danni" data-bind="B.danni">${esc(r.B.danni)}</textarea></label></section>
  <section class="card"><div class="row" style="justify-content:space-between"><h3>13 · Grafico dell'incidente</h3><button class="btn small" data-act="autoSketch">Rigenera dalla dinamica</button></div>
    <span class="muted" style="font-size:12px">${r.schizzoManual ? "Disegno modificato a mano: va nel PDF così com'è." : "Disegnato in automatico da circostanze, zone d'urto e luogo. Se cambi la dinamica si aggiorna da solo. Puoi ritoccarlo con il dito."}</span>
    <div class="pad sketch"><canvas id="sketch"></canvas><span class="hint">disegna con il dito</span></div>
    <div class="row"><div class="seg" style="flex:1">${[["#1F5FD6", "Tratto A"], ["#C99A00", "Tratto B"], ["#222222", "Strada"]].map(([c, l], i) => `<button data-act="pen" data-c="${c}" class="${(S.pen || "#222222") === c ? "on" : ""}">${l}</button>`).join("")}</div><button class="btn small" data-act="clearSketch">Cancella</button></div></section>
  <section class="card"><h3>14 · Osservazioni</h3><div class="grid2">
    <label class="fld" for="A-osserv"><span><span class="tag a">A</span> Osservazioni</span><textarea id="A-osserv" data-bind="A.osserv">${esc(r.A.osserv)}</textarea></label>
    <label class="fld" for="B-osserv"><span><span class="tag b">B</span> Osservazioni</span><textarea id="B-osserv" data-bind="B.osserv">${esc(r.B.osserv)}</textarea></label></div></section>`;
}

function stepRec(r) {
  const card = who => { const P = r[who], on = S.rec.who === who, name = [P.nome, P.cognome].filter(Boolean).join(" ") || `Conducente ${who}`;
    const hint = who === "A" ? (r.A.circ.includes(8) ? "Hai segnato «tamponava»: racconta la tua versione dei fatti." : "") : (r.B.circ.includes(8) ? "B ha tamponato: può dichiarare la sua versione dei fatti." : "");
    return `<section class="card ${who.toLowerCase()}"><div class="row" style="justify-content:space-between"><b>${esc(name)}</b><span class="tag ${who.toLowerCase()}">${who}</span></div>
      ${hint ? `<div class="banner info" style="font-size:13px"><span class="ic">i</span><div>${hint}</div></div>` : ""}
      <div class="rec"><button class="recbtn ${on ? "on" : ""}" data-act="rec" data-who="${who}" aria-label="${on ? "Ferma registrazione" : "Avvia registrazione"}">${on ? "STOP" : "REC"}</button>
        <div><div class="timer" id="timer-${who}">${on ? "00:00" : P.recDur ? fmtDur(P.recDur) : "00:00"}</div><div class="muted" style="font-size:13px">${on ? "Sto registrando… premi STOP alla fine: poi trascrivo" : P.recAudio ? "Registrazione salvata · premi REC per aggiungere" : "Premi REC, consenti il microfono e parla"}</div></div></div>
      ${S.recErr?.[who] ? `<div class="banner warn" style="font-size:13px"><span class="ic">!</span><div>${esc(S.recErr[who])}
        ${IS_PREVIEW || !navigator.mediaDevices ? `<div class="row" style="margin-top:8px"><label class="btn small" style="position:relative">Allega una registrazione<input type="file" accept="audio/*" capture data-act-file="audio" data-who="${who}" style="position:absolute;inset:0;opacity:0"></label></div>` : ""}</div></div>` : ""}
      ${S.recUrl?.[who] ? `<audio controls src="${S.recUrl[who]}" style="width:100%"></audio>` : ""}
      ${S.asr?.[who]?.busy ? `<div class="banner info" style="font-size:13px"><span class="spin"></span><div id="asr-${who}">${esc(S.asr[who].msg)}</div></div>` : ""}
      ${S.asr?.[who]?.err ? `<div class="banner warn" style="font-size:13px"><span class="ic">!</span><div>${esc(S.asr[who].err)}</div></div>` : ""}
      ${S.recBlob?.[who] && !S.asr?.[who]?.busy && !on ? `<button class="btn small" data-act="retranscribe" data-who="${who}" style="align-self:flex-start">Trascrivi di nuovo la registrazione</button>` : ""}
      <label class="fld" for="${who}-rec"><span>Trascrizione della dichiarazione ${on ? "· in tempo reale" : "· puoi correggerla"}</span><textarea id="${who}-rec" data-bind="${who}.rec" style="min-height:120px" placeholder="Premi REC e racconta cosa è successo: il testo comparirà qui.">${esc(P.rec)}</textarea></label></section>`; };
  return `<div><h1>REC · La tua versione</h1><p class="muted" style="margin:6px 0 0">Ognuno può dichiarare a voce come sono andati i fatti. La dichiarazione viene allegata al CID, separata dal modulo firmato da entrambi.</p></div>
  ${card("A")}${card("B")}`;
}

function missing(r) {
  const m = [];
  ["A", "B"].forEach(w => REQUIRED.forEach(k => { if (!r[w][k]) m.push(`${w}: ${ALL_FIELDS.find(f => f.k === k).l}`); }));
  if (!r.luogo.comune && !r.luogo.via) m.push("Località");
  ["A", "B"].forEach(w => { if (r[w].cf && !cfValid(r[w].cf)) m.push(`${w}: codice fiscale non valido`); });
  if (!r.A.circ.length && !r.B.circ.length) m.push("Almeno una circostanza");
  return m;
}
const canComplete = r => r.firmaA && r.firmaB && r.veritieri;
function editedBanner(r) {
  if (r.status !== "completo") return "";
  return r.modifiedAfterSign ? `<div class="banner warn"><span class="ic">!</span><div><b>Modificato dopo la firma</b> (${esc(fmtDateTime(r.modifiedAt))}). Il modulo dice che non va modificato dopo la firma: per renderlo valido cancellate le firme e firmate di nuovo entrambi, poi «Salva le modifiche». Altrimenti nel PDF resta l'indicazione della modifica.</div></div>`
    : `<div class="banner info"><span class="ic">i</span><div>CID firmato il ${esc(fmtDateTime(r.signedAt))}. Puoi andare avanti e indietro tra i passi e correggere i campi.</div></div>`;
}
function stepFirme(r) {
  const m = missing(r);
  return `<div><h1>Firme</h1><p class="muted" style="margin:6px 0 0">Casella 15. Firmate entrambi con il dito, uno alla volta, su questo telefono.</p></div>${editedBanner(r)}
  ${m.length ? `<div class="banner warn"><span class="ic">!</span><div><b>Mancano ${m.length} dati.</b> Puoi firmare lo stesso, ma l'assicurazione potrebbe chiederli: ${esc(m.slice(0, 6).join(" · "))}${m.length > 6 ? " …" : ""}</div></div>` : `<div class="banner ok"><span class="ic">✓</span><div>Tutti i dati essenziali sono compilati.</div></div>`}
  ${["A", "B"].map(w => `<section class="card ${w.toLowerCase()}"><div class="row" style="justify-content:space-between"><b>Firma conducente ${w} · ${esc([r[w].nome, r[w].cognome].filter(Boolean).join(" ") || "—")}</b><span class="tag ${w.toLowerCase()}">${w}</span></div>
    <div class="pad sign"><canvas id="sign${w}"></canvas><span class="line"></span><span class="hint">${r["firma" + w] ? "firmato" : "firma qui"}</span></div>
    <button class="btn small" data-act="clearSign" data-who="${w}" style="align-self:flex-start">Cancella firma</button></section>`).join("")}
  <section class="card">${checkHTML("R", "veritieri", "Entrambi i conducenti confermano che i dati sono veritieri e che dopo la firma il modulo non può essere modificato.", r, true)}</section>`;
}

function stepCID(r) {
  const col = w => { const P = r[w]; return `<div class="col ${w.toLowerCase()}"><span class="tag ${w.toLowerCase()}" style="align-self:flex-start">VEICOLO ${w}</span>
    <div class="kv"><span>Conducente</span><b>${esc(P.nome)} ${esc(P.cognome)}</b></div><div class="kv"><span>Veicolo</span>${esc(P.marca)} ${esc(P.modello)} <span class="plate" style="align-self:flex-start">${esc(P.targa || "—")}</span></div>
    <div class="kv"><span>Assicurazione</span>${esc(P.assicurazione || "—")}<br>Pol. ${esc(P.polizza || "—")}</div>
    <div class="kv"><span>Punto d'urto</span>${esc(P.urto.map(z => ZONES[z]).join(", ") || "—")}</div>
    <div class="kv"><span>Circostanze</span>${esc(P.circ.join(", ") || "—")}</div>

async function saveFile(name, blob, type) {

  try { const file = new File([blob], name, { type });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; } } catch (e) { if (e?.name === "AbortError") return; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch { toast("Download non disponibile qui"); }
